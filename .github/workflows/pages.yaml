# Сборка browsable-сайта (site/, Vue + Vite) с русскими данными
# и деплой на GitHub Pages.
#
# ТРЕБУЕТСЯ РАЗОВАЯ НАСТРОЙКА:
#   Settings → Pages → Build and deployment → Source: «GitHub Actions»
#
# Сайт: https://<owner>.github.io/RU-free-exercise-db/
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'dist/exercises.ru.json'
      - '.github/workflows/pages.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build (RU data, base path for project pages)
        working-directory: site
        run: npm run build
        env:
          VITE_BASE_DIR: /${{ github.event.repository.name }}/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
